version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
    groups:
      # Parser and plugin must stay at the same version, majors included.
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
